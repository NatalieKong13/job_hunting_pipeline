<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>求职 Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #eef1ec;
      --bg-accent: #e4e9e2;
      --surface: #fbfcf9;
      --ink: #1a211c;
      --ink-muted: #5c6b62;
      --line: #c9d2c8;
      --queue: #2f5d50;
      --queue-soft: #dce8e3;
      --apps: #3d4f7c;
      --apps-soft: #e2e6f0;
      --link: #1e4d8c;
      --warn: #8a5a1a;
      --warn-soft: #f3e6d0;
      --radius: 10px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "DM Sans", sans-serif;
      color: var(--ink);
      min-height: 100vh;
      background:
        radial-gradient(ellipse 80% 50% at 10% -10%, #d8e4dc 0%, transparent 55%),
        radial-gradient(ellipse 60% 40% at 100% 0%, #d5dce8 0%, transparent 50%),
        var(--bg);
      padding: 1.5rem 1.25rem 3rem;
      line-height: 1.45;
    }

    .wrap { max-width: 820px; margin: 0 auto; }

    header {
      margin-bottom: 1.25rem;
      display: flex;
      flex-wrap: wrap;
      align-items: end;
      justify-content: space-between;
      gap: 1rem;
    }

    header h1 {
      font-family: "Instrument Serif", serif;
      font-weight: 400;
      font-size: clamp(1.9rem, 4vw, 2.5rem);
      letter-spacing: -0.02em;
      line-height: 1.1;
    }

    header p {
      color: var(--ink-muted);
      font-size: 0.9rem;
      max-width: 26rem;
      margin-top: 0.35rem;
    }

    .meta {
      font-size: 0.78rem;
      color: var(--ink-muted);
      text-align: right;
    }

    .nav {
      display: flex;
      gap: 0.4rem;
      margin-bottom: 1.25rem;
      padding: 0.35rem;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
    }

    .nav button {
      flex: 1;
      font: inherit;
      font-size: 0.92rem;
      font-weight: 600;
      padding: 0.7rem 0.85rem;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: var(--ink-muted);
      cursor: pointer;
    }

    .nav button.active-queue {
      background: var(--queue-soft);
      color: var(--queue);
    }

    .nav button.active-apps {
      background: var(--apps-soft);
      color: var(--apps);
    }

    .page { display: none; }
    .page.active { display: block; }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      align-items: center;
      margin-bottom: 1rem;
    }

    .toolbar .spacer { flex: 1; min-width: 0.5rem; }

    .controls {
      margin-bottom: 1rem;
      padding: 1rem 1.1rem;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
    }

    .controls-head {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.5rem;
      margin-bottom: 0.85rem;
    }

    .controls-head h2 { font-size: 0.95rem; font-weight: 600; }
    .result-meta { font-size: 0.8rem; color: var(--ink-muted); }

    .controls-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 0.75rem 0.85rem;
    }

    .control label.cap {
      display: block;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: var(--ink-muted);
      margin-bottom: 0.3rem;
    }

    select, input[type="search"], input[type="date"] {
      width: 100%;
      font: inherit;
      font-size: 0.85rem;
      color: var(--ink);
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0.45rem 0.55rem;
    }

    select:focus, input:focus {
      outline: 2px solid var(--queue);
      outline-offset: 1px;
    }

    .checks {
      display: flex;
      flex-wrap: wrap;
      gap: 0.55rem 0.9rem;
      align-items: center;
    }

    .checks label {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.85rem;
      cursor: pointer;
      user-select: none;
    }

    .checks input { accent-color: var(--queue); }

    .btn {
      font: inherit;
      font-size: 0.82rem;
      font-weight: 600;
      border-radius: 6px;
      padding: 0.45rem 0.75rem;
      cursor: pointer;
      border: 1px solid transparent;
      white-space: nowrap;
    }

    .btn-primary {
      background: var(--queue);
      color: #fff;
      border-color: var(--queue);
    }

    .btn-primary:hover { filter: brightness(1.06); }
    .btn-primary:disabled { opacity: 0.55; cursor: wait; }

    .btn-secondary {
      background: var(--bg-accent);
      color: var(--ink);
      border-color: var(--line);
    }

    .btn-secondary:hover { background: var(--queue-soft); }

    .btn-apply {
      background: var(--queue);
      color: #fff;
    }

    .btn-ghost {
      background: transparent;
      color: var(--apps);
      border-color: var(--line);
    }

    .btn-ghost:hover { background: var(--apps-soft); }

    .toast {
      display: none;
      margin-bottom: 0.85rem;
      padding: 0.65rem 0.85rem;
      border-radius: 8px;
      background: var(--queue-soft);
      color: var(--queue);
      font-size: 0.85rem;
      font-weight: 500;
    }

    .toast.show { display: block; }
    .toast.err { background: var(--warn-soft); color: var(--warn); }

    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
    }

    .panel-head {
      padding: 0.9rem 1.1rem;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .panel-head h2 {
      font-size: 1.02rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.45rem;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 1.45rem;
      height: 1.45rem;
      padding: 0 0.35rem;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 600;
      color: #fff;
    }

    #page-queue .panel-head { background: var(--queue-soft); }
    #page-queue .badge { background: var(--queue); }
    #page-queue .accent { color: var(--queue); }

    #page-apps .panel-head { background: var(--apps-soft); }
    #page-apps .badge { background: var(--apps); }
    #page-apps .accent { color: var(--apps); }

    .hint { font-size: 0.75rem; color: var(--ink-muted); font-weight: 400; }
    .list { padding: 0.35rem; }

    .card {
      padding: 0.95rem 1rem;
      border-radius: 8px;
    }

    .card + .card { border-top: 1px solid var(--line); border-radius: 0; }
    .card:hover { background: var(--bg-accent); }

    .company { font-weight: 600; font-size: 0.95rem; }
    .title { font-size: 1.02rem; margin: 0.2rem 0 0.45rem; letter-spacing: -0.01em; }

    .app-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0.75rem;
      align-items: start;
      cursor: pointer;
    }

    .app-main .title {
      font-size: 0.98rem;
      margin: 0.15rem 0 0;
      color: var(--ink);
    }

    .app-date {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--apps);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      padding-top: 0.15rem;
    }

    .app-detail {
      display: none;
      margin-top: 0.75rem;
      padding-top: 0.75rem;
      border-top: 1px dashed var(--line);
      font-size: 0.85rem;
      color: var(--ink-muted);
    }

    .card.open .app-detail { display: block; }

    .app-detail a {
      color: var(--link);
      word-break: break-all;
    }

    .jd-box {
      margin-top: 0.45rem;
      padding: 0.65rem 0.75rem;
      background: var(--bg);
      border-radius: 6px;
      white-space: pre-wrap;
      line-height: 1.5;
    }

    .chev {
      font-size: 0.75rem;
      color: var(--ink-muted);
      margin-right: 0.35rem;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      margin-bottom: 0.5rem;
    }

    .tag {
      font-size: 0.68rem;
      font-weight: 600;
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
      background: var(--bg-accent);
      color: var(--ink-muted);
    }

    .tag.type-new_grad { background: var(--queue-soft); color: var(--queue); }
    .tag.type-intern { background: #e5eef8; color: #2a5080; }
    .tag.type-full_time { background: var(--apps-soft); color: var(--apps); }
    .tag.big { background: var(--warn-soft); color: var(--warn); }

    .fields { display: grid; gap: 0.25rem; font-size: 0.82rem; color: var(--ink-muted); }
    .fields span label {
      display: inline-block;
      min-width: 3.2rem;
      color: var(--ink);
      font-weight: 500;
      opacity: 0.7;
    }
    .fields a {
      color: var(--link);
      text-decoration: underline;
      text-underline-offset: 2px;
      word-break: break-all;
    }

    .card-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      margin-top: 0.75rem;
    }

    .id-tag {
      font-size: 0.7rem;
      color: var(--ink-muted);
      font-variant-numeric: tabular-nums;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 0.75rem;
      margin-bottom: 0.2rem;
    }

    .empty {
      padding: 2.4rem 1.25rem;
      text-align: center;
      color: var(--ink-muted);
      font-size: 0.9rem;
    }

    .empty em {
      font-family: "Instrument Serif", serif;
      font-style: italic;
      color: var(--ink);
      display: block;
      margin-bottom: 0.35rem;
      font-size: 1.15rem;
    }

    .apps-filters {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 0.65rem;
      align-items: end;
      margin-bottom: 1rem;
      padding: 0.9rem 1rem;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
    }

    @media (max-width: 560px) {
      .apps-filters { grid-template-columns: 1fr; }
      .app-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>求职 Dashboard</h1>
        <p>Queue 找岗与投递 · Applications 按申请日回顾。</p>
      </div>
      <div class="meta" id="updated">—</div>
    </header>

    <nav class="nav" aria-label="页面切换">
      <button type="button" id="nav-queue" class="active-queue">
        Queue
      </button>
      <button type="button" id="nav-apps">
        Applications
      </button>
    </nav>

    <div class="toast" id="toast"></div>

    <!-- QUEUE PAGE -->
    <section class="page active" id="page-queue">
      <div class="toolbar">
        <button type="button" class="btn btn-primary" id="btn-ai-search">AI 搜岗</button>
        <button type="button" class="btn btn-secondary" id="btn-refresh-queue">刷新未投岗位</button>
        <span class="hint" id="toolbar-hint">AI 搜岗会调用 Cursor 本地 Agent（耗 token）· 刷新仅合并本地未投岗位</span>
        <div class="spacer"></div>
      </div>

      <div class="controls" id="filters">
        <div class="controls-head">
          <h2>筛选 & 排序</h2>
          <div class="result-meta" id="filter-meta">—</div>
        </div>
        <div class="controls-grid">
          <div class="control">
            <label class="cap" for="sort">排序</label>
            <select id="sort">
              <option value="newest" selected>最新发布优先</option>
              <option value="salary">薪资从高到低</option>
              <option value="company">公司名 A→Z</option>
              <option value="added">最近加入 Queue</option>
            </select>
          </div>
          <div class="control">
            <label class="cap" for="posted">发布时间</label>
            <select id="posted">
              <option value="1">过去 24 小时</option>
              <option value="3">过去 3 天</option>
              <option value="7" selected>过去 7 天</option>
              <option value="30">过去 30 天</option>
              <option value="all">不限</option>
            </select>
          </div>
          <div class="control">
            <label class="cap" for="role">机会类型</label>
            <select id="role">
              <option value="both" selected>New Grad + Co-op/Intern</option>
              <option value="new_grad">仅 New Grad</option>
              <option value="intern">仅 Co-op / Intern</option>
              <option value="all">全部类型</option>
            </select>
          </div>
          <div class="control">
            <label class="cap" for="location">地点</label>
            <select id="location">
              <option value="canada" selected>加拿大</option>
              <option value="toronto">Toronto / Ontario</option>
              <option value="remote">含 Remote</option>
              <option value="all">不限</option>
            </select>
          </div>
          <div class="control">
            <label class="cap" for="source">来源</label>
            <select id="source">
              <option value="all" selected>全部来源</option>
              <option value="Indeed">Indeed</option>
              <option value="LinkedIn">LinkedIn</option>
              <option value="other">其他</option>
            </select>
          </div>
          <div class="control">
            <label class="cap" for="q">关键词</label>
            <input id="q" type="search" placeholder="公司 / 职位 / 备注" />
          </div>
          <div class="control" style="grid-column: 1 / -1;">
            <label class="cap">开关</label>
            <div class="checks">
              <label><input type="checkbox" id="exclude-senior" checked /> 排除 Senior / Staff / Principal / Lead</label>
              <label><input type="checkbox" id="big-tech" /> 仅大厂优先</label>
              <label><input type="checkbox" id="has-salary" /> 只要写了薪资</label>
              <label><input type="checkbox" id="dedupe" checked /> 去重（同公司+职位）</label>
            </div>
          </div>
          <div class="control">
            <button type="button" class="btn btn-secondary" id="reset-filters" style="width:100%">恢复默认</button>
          </div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-head">
          <h2><span class="accent">Queue</span> <span class="badge" id="queue-count">0</span></h2>
          <span class="hint">未投 · 待 Review</span>
        </div>
        <div class="list" id="queue-list"></div>
      </div>
    </section>

    <!-- APPLICATIONS PAGE -->
    <section class="page" id="page-apps">
      <div class="apps-filters">
        <div class="control">
          <label class="cap" for="app-date">按申请日（日历）</label>
          <input type="date" id="app-date" />
        </div>
        <button type="button" class="btn btn-secondary" id="clear-app-date">全部日期</button>
        <div class="result-meta" id="apps-meta" style="align-self:center">—</div>
      </div>

      <div class="panel">
        <div class="panel-head">
          <h2><span class="accent">Applications</span> <span class="badge" id="apps-count">0</span></h2>
          <span class="hint">点击卡片展开链接与 JD</span>
        </div>
        <div class="list" id="apps-list"></div>
      </div>
    </section>
  </div>

    <script src="data.js?v=20260913e"></script>
  <script src="app.js?v=20260913e"></script>
</body>
</html>
