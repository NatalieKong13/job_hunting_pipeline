<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>求职 Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #eef1ec;
      --bg-accent: #e4e9e2;
      --surface: #fbfcf9;
      --ink: #1a211c;
      --ink-muted: #5c6b62;
      --line: #c9d2c8;
      --queue: #2f5d50;
      --queue-soft: #dce8e3;
      --apps: #3d4f7c;
      --apps-soft: #e2e6f0;
      --link: #1e4d8c;
      --radius: 10px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "DM Sans", sans-serif;
      color: var(--ink);
      min-height: 100vh;
      background:
        radial-gradient(ellipse 80% 50% at 10% -10%, #d8e4dc 0%, transparent 55%),
        radial-gradient(ellipse 60% 40% at 100% 0%, #d5dce8 0%, transparent 50%),
        var(--bg);
      padding: 2rem 1.25rem 3rem;
      line-height: 1.45;
    }

    .wrap {
      max-width: 1100px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 2rem;
      display: flex;
      flex-wrap: wrap;
      align-items: end;
      justify-content: space-between;
      gap: 1rem;
    }

    header h1 {
      font-family: "Instrument Serif", serif;
      font-weight: 400;
      font-size: clamp(2rem, 4vw, 2.75rem);
      letter-spacing: -0.02em;
      line-height: 1.1;
    }

    header p {
      color: var(--ink-muted);
      font-size: 0.95rem;
      max-width: 28rem;
    }

    .meta {
      font-size: 0.8rem;
      color: var(--ink-muted);
      text-align: right;
    }

    .flow {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 1rem;
      margin-bottom: 1.75rem;
      padding: 0.85rem 1rem;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      font-size: 0.85rem;
      color: var(--ink-muted);
    }

    .flow strong { color: var(--ink); font-weight: 600; }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.5rem;
    }

    @media (min-width: 900px) {
      .grid { grid-template-columns: 1fr 1fr; align-items: start; }
    }

    section.panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
    }

    .panel-head {
      padding: 1rem 1.15rem;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .panel-head h2 {
      font-size: 1.05rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 1.5rem;
      height: 1.5rem;
      padding: 0 0.4rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    #queue-panel .panel-head { background: var(--queue-soft); }
    #queue-panel .badge { background: var(--queue); color: #fff; }
    #queue-panel .accent { color: var(--queue); }

    #apps-panel .panel-head { background: var(--apps-soft); }
    #apps-panel .badge { background: var(--apps); color: #fff; }
    #apps-panel .accent { color: var(--apps); }

    .hint {
      font-size: 0.75rem;
      color: var(--ink-muted);
      font-weight: 400;
    }

    .list { padding: 0.5rem; }

    .card {
      padding: 1rem 1rem 0.9rem;
      border-radius: 8px;
      border: 1px solid transparent;
      transition: background 0.15s ease;
    }

    .card + .card {
      border-top: 1px solid var(--line);
      border-radius: 0;
    }

    .card:hover { background: var(--bg-accent); }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 0.75rem;
      margin-bottom: 0.35rem;
    }

    .company {
      font-weight: 600;
      font-size: 0.95rem;
    }

    .title {
      font-size: 1.05rem;
      margin-bottom: 0.55rem;
      letter-spacing: -0.01em;
    }

    .fields {
      display: grid;
      gap: 0.25rem;
      font-size: 0.82rem;
      color: var(--ink-muted);
    }

    .fields span label {
      display: inline-block;
      min-width: 3.2rem;
      color: var(--ink);
      font-weight: 500;
      opacity: 0.7;
    }

    .fields a {
      color: var(--link);
      text-decoration: underline;
      text-underline-offset: 2px;
      word-break: break-all;
    }

    .status-pill {
      font-size: 0.72rem;
      font-weight: 600;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      background: var(--apps-soft);
      color: var(--apps);
      white-space: nowrap;
    }

    .id-tag {
      font-size: 0.7rem;
      color: var(--ink-muted);
      font-variant-numeric: tabular-nums;
    }

    .empty {
      padding: 2.5rem 1.25rem;
      text-align: center;
      color: var(--ink-muted);
      font-size: 0.9rem;
    }

    .empty em {
      font-family: "Instrument Serif", serif;
      font-style: italic;
      color: var(--ink);
      display: block;
      margin-bottom: 0.35rem;
      font-size: 1.15rem;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>求职 Dashboard</h1>
        <p>Queue 待你 Review → 告诉 AI「处理这个职位」→ 完成后进入 Applications。</p>
      </div>
      <div class="meta" id="updated">—</div>
    </header>

    <div class="flow">
      <span><strong>1.</strong> AI 找职位 → Queue</span>
      <span><strong>2.</strong> 你 Review</span>
      <span><strong>3.</strong> 你说「处理 q-xxx / 这家」</span>
      <span><strong>4.</strong> AI 准备材料并移到 Applications</span>
    </div>

    <div class="grid">
      <section class="panel" id="queue-panel">
        <div class="panel-head">
          <h2><span class="accent">Queue</span> <span class="badge" id="queue-count">0</span></h2>
          <span class="hint">未处理 · 待 Review</span>
        </div>
        <div class="list" id="queue-list"></div>
      </section>

      <section class="panel" id="apps-panel">
        <div class="panel-head">
          <h2><span class="accent">Applications</span> <span class="badge" id="apps-count">0</span></h2>
          <span class="hint">已处理 · 跟进中</span>
        </div>
        <div class="list" id="apps-list"></div>
      </section>
    </div>
  </div>

  <script src="data.js"></script>
  <script>
    // 若 data.js 因 file:// 未加载，使用内联兜底，保证页面可渲染
    if (!window.JOB_DATA) {
      window.JOB_DATA = { updatedAt: "2026-09-13", queue: [], applications: [] };
    }
    function esc(s) {
      return String(s ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function field(label, value, isLink) {
      if (value == null || value === "") return "";
      const v = isLink
        ? `<a href="${esc(value)}" target="_blank" rel="noopener noreferrer">${esc(value)}</a>`
        : esc(value);
      return `<div><span><label>${esc(label)}</label></span>${v}</div>`;
    }

    function renderQueue(items) {
      const el = document.getElementById("queue-list");
      document.getElementById("queue-count").textContent = items.length;
      if (!items.length) {
        el.innerHTML = `<div class="empty"><em>Queue 是空的</em>等 AI 把找到的职位放进来</div>`;
        return;
      }
      el.innerHTML = items.map((j) => `
        <article class="card">
          <div class="card-top">
            <div class="company">${esc(j.company)}</div>
            <span class="id-tag">${esc(j.id)}</span>
          </div>
          <div class="title">${esc(j.title)}</div>
          <div class="fields">
            ${field("地点", j.location)}
            ${field("薪资", j.salary)}
            ${field("链接", j.url, true)}
            ${field("备注", j.notes)}
          </div>
        </article>
      `).join("");
    }

    function renderApps(items) {
      const el = document.getElementById("apps-list");
      document.getElementById("apps-count").textContent = items.length;
      if (!items.length) {
        el.innerHTML = `<div class="empty"><em>还没有申请记录</em>处理完 Queue 里的职位后会出现在这里</div>`;
        return;
      }
      el.innerHTML = items.map((j) => `
        <article class="card">
          <div class="card-top">
            <div class="company">${esc(j.company)}</div>
            <span class="status-pill">${esc(j.status)}</span>
          </div>
          <div class="title">${esc(j.title)}</div>
          <div class="fields">
            ${field("申请日", j.appliedAt)}
            ${field("下一步", j.nextStep)}
            ${j.url ? field("链接", j.url, true) : ""}
            ${j.notes ? field("备注", j.notes) : ""}
            <div class="id-tag" style="margin-top:0.35rem">${esc(j.id)}</div>
          </div>
        </article>
      `).join("");
    }

    const data = window.JOB_DATA || { queue: [], applications: [] };
    document.getElementById("updated").textContent =
      data.updatedAt ? `更新于 ${data.updatedAt}` : "";
    renderQueue(data.queue || []);
    renderApps(data.applications || []);
  </script>
</body>
</html>
